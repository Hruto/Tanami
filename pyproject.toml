[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tanami-vision"
version = "0.1.0"
description = "Tanami vision inference service - stateless ML scoring for leaf disease and fruit ripeness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "python-multipart>=0.0.20,<0.1",
  "pillow==13.0.0",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "anyio>=4.15.1,<5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio>=0.24,<2",
  "httpx==0.28.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "openapi-spec-validator==0.9.0",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  "pip-audit==2.10.1",
  "onnx>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ASYNC", "T20"]
ignore = [
  "RUF001", # ambiguous unicode in Indonesian user-facing strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "ARG002", "S105", "S106", "S311"]
"app/api/routes/*.py" = ["B008"] # FastAPI Depends()/Form()/File() in defaults
"scripts/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "contract: validates the published OpenAPI contract",
  "slow: tests that load a real ONNX model",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
