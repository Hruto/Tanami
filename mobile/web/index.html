
<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tanami - Plant Care Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tanami">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/logo_tanami.svg">

  <title>Tanami</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #F8FAF7;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F8FAF7;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    .dot-loader {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .dot-loader span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #2E6B52;
      animation: dotBounce 0.8s infinite ease-in-out;
    }

    .dot-loader span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot-loader span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.5;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <!-- Tanami Loading -->
  <div id="loading">
    <div class="dot-loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    const loading = document.querySelector('#loading');

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();

        loading.style.opacity = '0';

        setTimeout(() => {
          loading.remove();
        }, 300);
      }
    });
  </script>

</body>
</html>
