name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: lint, format, types. No model or heavy import involved.
  # ---------------------------------------------------------------------------
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install "ruff==0.17.2" "mypy==2.4.0" -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

  # ---------------------------------------------------------------------------
  # Tests, contract check and dependency audit.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Generate stub manifests
        run: python scripts/make_stub_models.py --with-shadow

      - name: Contract is in sync with code
        run: python scripts/export_openapi.py --check

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The ONNX path is tested separately because it needs the real runtime and a
  # generated fixture model. Keeps the main test job fast and dependency-light.
  # ---------------------------------------------------------------------------
  onnx:
    name: ONNX backend
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Generate fixture models
        run: |
          python scripts/make_fixture_onnx.py --model-dir models --version disease-chili-v0.1.0 --scan-type disease
          python scripts/make_fixture_onnx.py --model-dir models --version ripeness-chili-v0.1.0 --scan-type ripeness

      - name: Exercise the real ONNX session
        env:
          VISION_MODEL_BACKEND: onnx
        run: pytest tests/unit/test_predictor.py -v

  # ---------------------------------------------------------------------------
  # Container build, so a broken Dockerfile fails on the PR, not on deploy.
  # ---------------------------------------------------------------------------
  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate the stub models to mount
        # Models are not baked into the image (they are deployed by mount), so
        # the smoke test has to supply them.
        run: |
          pip install .
          python scripts/make_stub_models.py

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: tanami-vision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name vision -p 8001:8001 \
            -e VISION_APP_ENV=local \
            -e VISION_MODEL_BACKEND=stub \
            -v "$PWD/models:/app/models:ro" \
            tanami-vision:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/readyz > /dev/null; then
              echo "service ready"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become ready" >&2
          docker logs vision >&2
          exit 1

      - name: The image refuses stub in production
        run: |
          # Guard rail: stub predictions must never ship as if they were a model.
          if docker run --rm \
            -e VISION_APP_ENV=production \
            -e VISION_MODEL_BACKEND=stub \
            -e VISION_SERVICE_TOKEN=t \
            -e VISION_ADMIN_TOKEN=a \
            -v "$PWD/models:/app/models:ro" \
            tanami-vision:ci; then
            echo "ERROR: image started with the stub backend in production" >&2
            exit 1
          fi
          echo "correctly refused"

      - name: Publish to GHCR on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Dependency and secret scanning. Fails only on fixable findings so a
  # transitive CVE without an upgrade path does not block unrelated PRs.
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install "pip-audit==2.10.1" .

      - name: Audit dependencies
        run: pip-audit --strict --progress-spinner off

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
