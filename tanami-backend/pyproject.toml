[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tanami-backend"
version = "0.1.0"
description = "Tanami backend API - auth, farms, scans, reminders, forum, weather"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "email-validator==2.3.0",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy[asyncio]==2.0.44",
  "asyncpg==0.31.0",
  "psycopg[binary]==3.3.1",
  "alembic==1.18.1",
  "redis==7.2.1",
  "pyjwt[crypto]==2.11.0",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "boto3==1.43.118",
  "pillow==13.0.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "APScheduler==3.11.2",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "openapi-spec-validator==0.9.0",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  "pip-audit==2.10.1",
  "fakeredis[lua]==2.34.0",
  "pgserver==0.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ASYNC", "T20"]
ignore = [
  "RUF001", # ambiguous unicode in Indonesian user-facing strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "ARG002", "ARG003", "ARG005", "RET504", "S105", "S106", "S311", "S324"]
"app/api/**/*.py" = ["B008"] # FastAPI Depends()/Form()/File() in defaults
"app/core/security.py" = ["S106"] # argon2 default parameters, not a password
"scripts/*.py" = ["T20"]
"migrations/**" = ["E501", "T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "contract: validates the published OpenAPI contract",
  "db: requires a real PostgreSQL server",
]

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's asyncio layer runs database work inside greenlets; without this
# every line after an ``await session...`` call is reported as uncovered.
concurrency = ["thread", "greenlet"]
omit = ["app/jobs/scheduler.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
